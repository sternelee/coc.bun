name: Dev

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    if: github.event.pull_request.draft == false
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        versions:
          - neovim: "stable"
            vim: "v9.0.0438"
          - neovim: "nightly"
            vim: "nightly"
        node:
          - "24"

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve vim cache identity
        if: matrix.versions.vim != 'nightly'
        id: vim-cache-id
        shell: bash
        env:
          VIM_VERSION: ${{ matrix.versions.vim }}
        run: |
          . /etc/os-release
          echo "key=vim-install-v1-$RUNNER_OS-$RUNNER_ARCH-$ID-$VERSION_ID-$VIM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore vim installation
        if: matrix.versions.vim != 'nightly'
        id: vim-cache
        uses: actions/cache@v6
        with:
          path: ~/vim-${{ matrix.versions.vim }}
          key: ${{ steps.vim-cache-id.outputs.key }}

      - parallel:
        - name: Setup Node.js ${{ matrix.node }}
          uses: actions/setup-node@v6
          with:
            node-version: ${{ matrix.node }}
            cache: "npm"

        - name: Setup python3
          uses: actions/setup-python@v6
          with:
            python-version: "3.x"

        - name: Setup vim
          if: matrix.versions.vim == 'nightly' || steps.vim-cache.outputs.cache-hit != 'true'
          uses: rhysd/action-setup-vim@v1
          with:
            version: ${{ matrix.versions.vim }}

        - name: Setup neovim
          id: nvim
          uses: rhysd/action-setup-vim@v1
          with:
            neovim: true
            version: ${{ matrix.versions.neovim }}

        - name: Setup rg/ctags
          run: sudo apt-get install -y ripgrep exuberant-ctags

      - name: Expose vim
        id: vim
        env:
          VIM_VERSION: ${{ matrix.versions.vim }}
        run: |
          vim_bin="$HOME/vim-$VIM_VERSION/bin"
          test -x "$vim_bin/vim"
          echo "$vim_bin" >> "$GITHUB_PATH"
          echo "executable=$vim_bin/vim" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          npm i -g bytes
          npm ci
          pip install pynvim
          rg --version
          ctags --version
          vim --version
          nvim --version

      - name: Run tests
        env:
          VIM_COMMAND: ${{ steps.vim.outputs.executable }}
          NVIM_COMMAND: ${{ steps.nvim.outputs.executable }}
          COVERAGE_ARGS: ${{ matrix.versions.neovim == 'stable' && '--coverage' || '' }}
        run: |
          node --enable-source-maps scripts/test/cli.mjs -j 2 $COVERAGE_ARGS

      - name: Codecov
        uses: codecov/codecov-action@v6
        if: matrix.versions.neovim == 'stable'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  bun-smoke:
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node esbuild.js

      - name: Smoke test service process under Bun
        run: |
          bun build/index.js < /dev/zero > /tmp/bun-stdout.log 2> /tmp/bun-stderr.log &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "coc service process exited early under Bun"
            cat /tmp/bun-stderr.log
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          # The msgpack-RPC handshake must reach the editor on stdout.
          grep -aq "coc_process_pid" /tmp/bun-stdout.log
